<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="WebNav Hub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1f1f" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb347" />
      <stop offset="55%" stop-color="#ff9000" />
      <stop offset="100%" stop-color="#e07400" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9000" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ff9000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- base plate -->
  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#bg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none"
        stroke="#ff9000" stroke-opacity="0.22" stroke-width="1.5" />

  <!-- top glow -->
  <path d="M0 15 A15 15 0 0 1 15 0 H49 A15 15 0 0 1 64 15 V30 Q32 20 0 30 Z" fill="url(#glow)" />

  <!-- 2x2 nav grid: three outlined tiles, one solid focal tile -->
  <g>
    <rect x="13" y="13" width="16" height="16" rx="4.5" fill="url(#amber)" />
    <rect x="35" y="13" width="16" height="16" rx="4.5" fill="none"
          stroke="#ff9000" stroke-opacity="0.72" stroke-width="3.6" />
    <rect x="13" y="35" width="16" height="16" rx="4.5" fill="none"
          stroke="#ff9000" stroke-opacity="0.72" stroke-width="3.6" />
    <rect x="35" y="35" width="16" height="16" rx="4.5" fill="none"
          stroke="#ff9000" stroke-opacity="0.72" stroke-width="3.6" />
  </g>
</svg>
